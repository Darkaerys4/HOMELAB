networks:
  media_net:
  vpn_net:

services:

  # =========================
  # JELLYFIN
  # =========================

  jellyfin:
    image: jellyfin/jellyfin:10.11.6
    container_name: jellyfin
    networks:
      - media_net
    volumes:
      - /srv/docker/jellyfin:/config
      - /mnt/storage/jellyfin/cache:/cache
      - ${MEDIA}
    environment:
      - TZ=Europe/Madrid
      - PUID=1000
      - PGID=1000
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "110"
      - "1000"
    ports:
      - 8096:8096
      - 7359:7359/udp
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -Lk -fsS http://localhost:8096/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  seerr:
    image: ghcr.io/seerr-team/seerr:latest
    container_name: seerr
    init: true
    networks:
      - media_net
    volumes:
      - /srv/docker/seer:/app/config
    environment:
      - TZ=Europe/Madrid
    ports:
      - 5055:5055
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


  # =========================
  # ARR STACK
  # =========================

  sonarr:
    image: linuxserver/sonarr:latest
    container_name: sonarr
    networks:
      - media_net
    ports:
      - 8989:8989
    volumes:
      - /srv/docker/sonarr:/config
      - ${DESCARGA}
      - ${MEDIA}
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8989/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  radarr:
    image: linuxserver/radarr:latest
    container_name: radarr
    # network_mode: "service:gluetun"
    # depends_on:
    #   - gluetun
    ports:
      - 7878:7878
    volumes:
      - /srv/docker/radarr:/config
      - ${DESCARGA}
      - ${MEDIA}
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    networks:
    - media_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7878/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


  bazarr:
    image: linuxserver/bazarr:latest
    container_name: bazarr
    networks:
      - media_net
    ports:
      - 6767:6767
    volumes:
      - /srv/docker/bazarr:/config
      - ${DESCARGA}
      - ${MEDIA}
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:6767/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    networks:
      - media_net
    ports:
      - 9696:9696
    volumes:
      - /srv/docker/prowlarr:/config
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    # dns:
    #   - 1.1.1.1
    #   - 1.0.0.1
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9696/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


  jackett:
    image: lscr.io/linuxserver/jackett:latest
    container_name: jackett
    networks:
      - media_net
    ports:
      - 9117:9117
    volumes:
      - /srv/docker/jackett:/config
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
      - AUTO_UPDATE=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9117/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    # network_mode: "service:gluetun"
    networks:
      - media_net
    ports:
      - 8191:8191
    # depends_on:
    #   - gluetun
    dns:
      - 1.1.1.1
      - 1.0.0.1
    environment:
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8191/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


  # =========================
  # VPN
  # =========================

  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    networks:
      - vpn_net
      - media_net
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    volumes:
      - /srv/docker/gluetun:/gluetun
    environment:
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${OPENVPN_USER}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD}
      - SERVER_COUNTRIES=${COUNTRIES}
      - OPENVPN_PROTOCOL=udp
      - FIREWALL=on
      - FIREWALL_OUTBOUND_SUBNETS=172.18.0.0/16
      - PUID=1000
      - PGID=1000
    ports:
      - 6881:6881
      - 6881:6881/udp
      - 8701:8701
      # - 8191:8191
    # - 8191:8191 #flaresolverr
    #  - 7878:7878 #radarr
    # - 6767:6767 #bazarr
    # - 8989:8989 #sonarr
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  qbittorrent:
    image: linuxserver/qbittorrent
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    volumes:
      - /srv/docker/qbittorrent:/config
      - ${DESCARGA}
    environment:
      - WEBUI_PORT=8701
      - WEBUI_ADDRESS=0.0.0.0
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8701/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # =========================
  # HOMEPAGE
  # =========================
  homarr:
    image: ghcr.io/homarr-labs/homarr:latest
    container_name: homarr
    networks:
      - media_net
    ports:
      - 7575:7575
    volumes:
      - /srv/docker/homarr:/appdata
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - SECRET_ENCRYPTION_KEY=${HOMARRKEY}
      - TZ=Europe/Madrid
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7575/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


  # =========================
  # NGINX
  # =========================
  nginx:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy-manager
    networks:
      - media_net
    environment:
      - TZ=Europe/Madrid
      - PUID=1000
      - PGID=1000
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    volumes:
      - /srv/data:/data
      - /srv/docker/letsencrypt:/etc/letsencrypt
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:81/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  #===========================
  # IMMICH
  #===========================
  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    container_name: immich_server
    networks:
      - media_net
    ports:
      - 2283:2283
    volumes:
      - ${DPHOTO}:/usr/src/app/upload
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Europe/Madrid
      - DB_HOSTNAME=immich-postgres
      - DB_USERNAME=immich
      - DB_PASSWORD=immich_password
      - DB_DATABASE_NAME=immich
      - REDIS_HOSTNAME=immich-redis
    depends_on:
      - immich-redis
      - immich-postgres
    restart: unless-stopped

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:release
    container_name: immich_machine_learning
    networks:
      - media_net
    volumes:
      - ${IMMICHCACHE}
    environment:
      - TZ=Europe/Madrid
    restart: unless-stopped

  immich-redis:
    image: redis:7-alpine
    container_name: immich_redis
    networks:
      - media_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  immich-postgres:
    image: ghcr.io/immich-app/postgres:14-vectorchord0.3.0-pgvectors0.2.0
    container_name: immich_postgres
    networks:
      - media_net
    volumes:
      - ${IMMICHPOSTGRES}
    environment:
      - POSTGRES_USER=immich
      - POSTGRES_PASSWORD=immich_password
      - POSTGRES_DB=immich
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immich || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # =========================
  # UPTIME KUMA
  # =========================
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    networks:
      - media_net
    ports:
      - 3001:3001
    volumes:
      - /srv/docker/uptime-kuma:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=Europe/Madrid
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s


  # =========================
  # BESZEL
  # =========================
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    networks:
      - media_net
    ports:
      - 8090:8090
    volumes:
      - /srv/docker/beszel/data:/beszel_data
    environment:
      - TZ=Europe/Madrid
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8090/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  beszel-agent:
    image: henrygd/beszel-agent:latest
    container_name: beszel-agent
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/beszel-agent:/var/lib/beszel-agent
    environment:
      - LISTEN=45876
      - KEY=${BESZELKEY}
      - TOKEN=${TOKEN}
      - HUB_URL=http://localhost:8090
    restart: unless-stopped
